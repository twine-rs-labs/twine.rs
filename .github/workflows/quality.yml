name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript and documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit and packaging tests
        run: npm run test:ci
      - name: Lint and documentation checks
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Production web build
        run: npm run build:web

  rust:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust: [1.88.0, 1.96.0]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
      - name: Rust formatting
        run: cargo +${{ matrix.rust }} fmt --all -- --check
      - name: Rust Clippy
        run: cargo +${{ matrix.rust }} clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust workspace tests
        run: cargo +${{ matrix.rust }} test --workspace --locked
