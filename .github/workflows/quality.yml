name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

# Only pull-request refreshes supersede one another. Merge queue and main
# evidence must always finish because release candidates bind their exact SHA.
concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript and documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned mdBook tool
        id: mdbook-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mdbook-0.5.4
          key: mdbook-${{ runner.os }}-${{ runner.arch }}-0.5.4-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install or verify pinned mdBook
        shell: bash
        env:
          MDBOOK_ROOT: ${{ runner.temp }}/mdbook-0.5.4
        run: |
          if [[ "${{ steps.mdbook-cache.outputs.cache-hit }}" != 'true' ]]; then
            cargo install mdbook --version 0.5.4 --locked --root "$MDBOOK_ROOT"
          fi
          echo "$MDBOOK_ROOT/bin" >> "$GITHUB_PATH"
          test "$("$MDBOOK_ROOT/bin/mdbook" --version)" = 'mdbook v0.5.4'
      - name: Unit and packaging tests
        run: npm run test:ci
      - name: Lint and documentation checks
        run: npm run lint
      - name: Build compatibility manual
        run: npm run build:docs
      - name: Formatting
        run: npm run format:check
      - name: Reproducible production web build
        run: npm run check:web-reproducibility
      - name: Fresh-install offline PWA
        run: npm run e2e:pwa
        env:
          TWINE_PWA_USE_EXISTING_BUILD: 1

  rust:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust: [1.88.0, 1.96.0]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
      - name: Rust formatting
        run: cargo +${{ matrix.rust }} fmt --all -- --check
      - name: Rust Clippy
        run: cargo +${{ matrix.rust }} clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust publication policy
        run: node --test scripts/rust-policy-tests/*.test.mjs
        env:
          TWINE_RS_CARGO_TOOLCHAIN: ${{ matrix.rust }}
      - name: Rust workspace tests
        run: cargo +${{ matrix.rust }} test --workspace --locked

  quality-gate:
    name: Quality gate
    if: always()
    needs: [javascript, rust]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every quality job
        shell: bash
        env:
          JAVASCRIPT_RESULT: ${{ needs.javascript.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$JAVASCRIPT_RESULT" = 'success'
          test "$RUST_RESULT" = 'success'
