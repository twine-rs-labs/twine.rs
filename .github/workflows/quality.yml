name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript and documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Install pinned mdBook
        run: cargo install mdbook --version 0.5.4 --locked
      - name: Unit and packaging tests
        run: npm run test:ci
      - name: Lint and documentation checks
        run: npm run lint
      - name: Build compatibility manual
        run: npm run build:docs
      - name: Formatting
        run: npm run format:check
      - name: Reproducible production web build
        run: npm run check:web-reproducibility

  rust:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust: [1.88.0, 1.96.0]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
      - name: Rust formatting
        run: cargo +${{ matrix.rust }} fmt --all -- --check
      - name: Rust Clippy
        run: cargo +${{ matrix.rust }} clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust publication policy
        run: node --test scripts/rust-policy-tests/*.test.mjs
        env:
          TWINE_RS_CARGO_TOOLCHAIN: ${{ matrix.rust }}
      - name: Rust workspace tests
        run: cargo +${{ matrix.rust }} test --workspace --locked
