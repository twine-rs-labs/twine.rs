name: Packaged Electron smoke

on:
  pull_request:
  merge_group:
    types: [checks_requested]

# Cancel only superseded pull-request runs. Exact merge-queue evidence remains
# durable for pre-tag release candidate validation.
concurrency:
  group: packaged-electron-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    name: Classify packaged changes
    runs-on: ubuntu-24.04
    outputs:
      native_required: ${{ steps.mode.outputs.native_required }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Classify changed paths fail closed
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          node scripts/classify-packaged-changes.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$GITHUB_OUTPUT"
      - name: Apply merge-queue native transition
        id: mode
        shell: bash
        env:
          CHANGED_PATHS_REQUIRE_NATIVE: ${{ steps.paths.outputs.native_required }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_QUEUE_NATIVE_ONLY: ${{ vars.TWINE_MERGE_QUEUE_NATIVE_ONLY || 'false' }}
        run: |
          native_required="$CHANGED_PATHS_REQUIRE_NATIVE"
          # Transition switch: gate-only pull-request runs intentionally retain no
          # desktop-local-test-bundle, so release evidence cannot accept them.
          if [[ "$MERGE_QUEUE_NATIVE_ONLY" == 'true' && "$EVENT_NAME" != 'merge_group' ]]; then
            native_required=false
          fi
          echo "native_required=$native_required" >> "$GITHUB_OUTPUT"

  package-installable:
    name: ${{ matrix.label }} installable smoke
    needs: classify
    if: needs.classify.outputs.native_required == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            platform: linux
            os: ubuntu-24.04
            arch: x64
            appimage_arch: x86_64
            artifact_dir: artifacts/local/linux-x64
            artifacts: |
              artifacts/local/linux-x64/Twine-RS-*-linux-x86_64.AppImage
              artifacts/local/linux-x64/Twine-RS-*-linux-x64.zip
              artifacts/local/linux-x64/*.artifact-manifest.json
              artifacts/local/linux-x64/LOCAL-TEST-ONLY.txt
          - label: Linux ARM64
            platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
            appimage_arch: arm64
            artifact_dir: artifacts/local/linux-arm64
            artifacts: |
              artifacts/local/linux-arm64/Twine-RS-*-linux-arm64.AppImage
              artifacts/local/linux-arm64/Twine-RS-*-linux-arm64.zip
              artifacts/local/linux-arm64/*.artifact-manifest.json
              artifacts/local/linux-arm64/LOCAL-TEST-ONLY.txt
          - label: macOS Intel
            platform: mac
            os: macos-15-intel
            arch: x64
            artifact_dir: artifacts/local/mac-x64
            artifacts: |
              artifacts/local/mac-x64/Twine-RS-*-mac-x64.dmg
              artifacts/local/mac-x64/*.artifact-manifest.json
              artifacts/local/mac-x64/LOCAL-TEST-ONLY.txt
          - label: macOS ARM64
            platform: mac
            os: macos-15
            arch: arm64
            artifact_dir: artifacts/local/mac-arm64
            artifacts: |
              artifacts/local/mac-arm64/Twine-RS-*-mac-arm64.dmg
              artifacts/local/mac-arm64/*.artifact-manifest.json
              artifacts/local/mac-arm64/LOCAL-TEST-ONLY.txt
          - label: Windows x64
            platform: windows
            os: windows-2025
            arch: x64
            artifact_dir: artifacts/local/win-x64
            artifacts: |
              artifacts/local/win-x64/Twine-RS-*-win-x64.exe
              artifacts/local/win-x64/*.artifact-manifest.json
              artifacts/local/win-x64/LOCAL-TEST-ONLY.txt

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure native tool cache locations
        shell: bash
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-cache" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder-cache" >> "$GITHUB_ENV"
          echo "WASM_BINDGEN_ROOT=$RUNNER_TEMP/wasm-bindgen-cli-0.2.125" >> "$GITHUB_ENV"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Restore pinned wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wasm-bindgen-cli-0.2.125
          key: wasm-bindgen-cli-${{ runner.os }}-${{ runner.arch }}-0.2.125-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install or verify pinned wasm-bindgen CLI
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          if [[ "${{ steps.wasm-bindgen-cache.outputs.cache-hit }}" != 'true' ]]; then
            cargo install wasm-bindgen-cli --version 0.2.125 --locked --root "$WASM_BINDGEN_ROOT"
          fi
          echo "$WASM_BINDGEN_ROOT/bin" >> "$GITHUB_PATH"
          test "$("$WASM_BINDGEN_ROOT/bin/wasm-bindgen" --version)" = 'wasm-bindgen 0.2.125'
      - name: Restore Electron download caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: electron-downloads-${{ runner.os }}-${{ runner.arch }}-electron-43.1.1-builder-26.15.3-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install Playwright Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Install Playwright Chromium and dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install --yes --no-install-recommends libglib2.0-bin
      - name: Build production Electron app
        run: npm run build:electron-app:ci
        env:
          NODE_ENV: production
      - name: Test Windows native referenced-media hardening
        if: runner.os == 'Windows'
        run: cargo test -p twine_native --locked
      - name: Package installable artifacts
        run: npm run package:electron:artifacts -- --${{ matrix.arch }}
        env:
          NODE_ENV: production
          TWINE_RELEASE_PROFILE: local
      - name: Retain target artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-local-target-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifacts }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Exercise Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          app_image=$(ls "${{ matrix.artifact_dir }}"/Twine-RS-*-linux-${{ matrix.appimage_arch }}.AppImage)
          chmod +x "$app_image"
          APPIMAGE_EXTRACT_AND_RUN=1 TWINE_E2E_EXECUTABLE="$app_image" xvfb-run --auto-servernum npm run e2e:electron:packaged -- --grep "flushes a trailing"
      - name: Extend Linux ARM64 preview wait in test harness
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        shell: bash
        run: |
          perl -0pi -e 's/(async function expectCurrentPassage.*?timeout: )30_000/${1}90_000/s' e2e/packaged-electron-preview.spec.ts
          node -e '
            const { readFileSync } = require("node:fs");
            const source = readFileSync("e2e/packaged-electron-preview.spec.ts", "utf8");
            const helper = source.match(/async function expectCurrentPassage.*?\n}/s)?.[0];
            if (!helper?.includes("timeout: 90_000")) {
              throw new Error("Linux ARM64 current-passage wait was not extended.");
            }
          '
      - name: Extract and smoke Linux ZIP
        if: runner.os == 'Linux'
        shell: bash
        run: |
          extract_dir="$RUNNER_TEMP/twine-rs-linux-zip"
          mkdir -p "$extract_dir"
          unzip -q "${{ matrix.artifact_dir }}"/Twine-RS-*-linux-${{ matrix.arch }}.zip -d "$extract_dir"
          TWINE_E2E_EXECUTABLE="$extract_dir/twine-rs" xvfb-run --auto-servernum npm run e2e:electron:packaged
      - name: Mount and smoke macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mount_dir="$RUNNER_TEMP/twine-rs-dmg"
          mkdir -p "$mount_dir"
          hdiutil attach "${{ matrix.artifact_dir }}"/Twine-RS-*-mac-${{ matrix.arch }}.dmg -nobrowse -readonly -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          TWINE_E2E_EXECUTABLE="$mount_dir/Twine RS.app/Contents/MacOS/Twine RS" npm run e2e:electron:packaged -- --grep "flushes a trailing|preserves sibling"
          hdiutil detach "$mount_dir"
          trap - EXIT
      - name: Install Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem '${{ matrix.artifact_dir }}' -Filter 'Twine-RS-*-win-x64.exe' | Select-Object -First 1
          $installDirectory = Join-Path $env:RUNNER_TEMP 'twine-rs-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDirectory") -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Installer exited with code $($process.ExitCode)."
          }
          $executable = Join-Path $installDirectory 'Twine RS.exe'
          $uninstaller = Join-Path $installDirectory 'Uninstall Twine RS.exe'
          if (!(Test-Path $executable) -or !(Test-Path $uninstaller)) {
            throw 'The NSIS package did not install the expected application and uninstaller.'
          }
          "TWINE_E2E_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TWINE_E2E_UNINSTALLER=$uninstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Smoke installed Windows app
        if: runner.os == 'Windows'
        run: npm run e2e:electron:packaged
      - name: Uninstall Windows package
        if: always() && runner.os == 'Windows' && env.TWINE_E2E_UNINSTALLER != ''
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:TWINE_E2E_UNINSTALLER -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($process.ExitCode)."
          }
      - name: Retain package smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: output/playwright/packaged-electron
          if-no-files-found: warn
          retention-days: 14

  assemble-local-test-bundle:
    name: Validate complete local desktop test bundle
    needs: [classify, package-installable]
    if: needs.classify.outputs.native_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - name: Clear checked-in release samples
        run: npm run release:clean
      - name: Download every target artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: desktop-local-target-*
          path: artifacts/incoming/local
          merge-multiple: true
      - name: Validate and organize local test matrix
        run: npm run release:assemble:local-test-bundle
      - name: Retain clearly labeled local test bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-local-test-bundle
          path: artifacts/local-test-bundle
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  packaged-electron-gate:
    name: Packaged Electron gate
    if: always()
    needs: [classify, package-installable, assemble-local-test-bundle]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected packaged evidence mode
        shell: bash
        env:
          ASSEMBLY_RESULT: ${{ needs.assemble-local-test-bundle.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          NATIVE_REQUIRED: ${{ needs.classify.outputs.native_required }}
          PACKAGE_RESULT: ${{ needs.package-installable.result }}
        run: |
          test "$CLASSIFY_RESULT" = 'success'
          if [[ "$NATIVE_REQUIRED" == 'true' ]]; then
            test "$PACKAGE_RESULT" = 'success'
            test "$ASSEMBLY_RESULT" = 'success'
          else
            test "$NATIVE_REQUIRED" = 'false'
            test "$PACKAGE_RESULT" = 'skipped'
            test "$ASSEMBLY_RESULT" = 'skipped'
          fi
