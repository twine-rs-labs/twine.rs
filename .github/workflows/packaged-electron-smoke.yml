name: Packaged Electron smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packaged-smoke:
    name: ${{ matrix.label }} packaged smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-24.04
            arch: x64
          - label: Linux ARM64
            os: ubuntu-24.04-arm
            arch: arm64
          - label: macOS Intel
            os: macos-15-intel
            arch: x64
          - label: macOS ARM64
            os: macos-15
            arch: arm64
          - label: Windows x64
            os: windows-2025
            arch: x64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Rust WASM tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.125 --locked
      - run: npm ci
      - name: Install Playwright Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Install Playwright Chromium and dependencies on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Build production Electron app
        run: npm run build:electron-app:ci
        env:
          NODE_ENV: production
      - name: Test Windows native referenced-media hardening
        if: runner.os == 'Windows'
        run: cargo test -p twine_native
      - name: Package native unpacked app
        run: npm run package:electron:dir -- --${{ matrix.arch }}
        env:
          NODE_ENV: production
      - name: Smoke packaged app on Windows
        if: runner.os == 'Windows'
        run: npm run e2e:electron:packaged
      - name: Smoke packaged app on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e:electron:packaged
      - name: Smoke packaged app on macOS
        if: runner.os == 'macOS'
        run: npm run e2e:electron:packaged -- --grep "flushes a trailing|preserves sibling"
