name: Publish desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag to recover as a draft or publish
        required: true
        type: string
      publish:
        description: Publish the inspected pre-tag candidate
        required: true
        default: false
        type: boolean
      candidate_run_id:
        description: Successful pre-tag candidate run ID (required manually)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag and select exact-main candidate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      candidate_run_id: ${{ steps.evidence.outputs.candidate_run_id }}
      channel: ${{ steps.plan.outputs.channel }}
      commit: ${{ steps.plan.outputs.commit }}
      plan: ${{ steps.plan.outputs.plan }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      profile: ${{ steps.plan.outputs.profile }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Validate manual mode inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || '' }}
        run: |
          if [[ ! "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Manual draft recovery and publication require candidate_run_id."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - name: Validate annotated tag and derive candidate identity
        id: plan
        shell: bash
        env:
          PLAN_PATH: docs/releases/plans/${{ inputs.tag || github.ref_name }}.json
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          plan="docs/releases/plans/${RELEASE_TAG}.json"
          test -f "$plan"
          commit="$(git rev-parse HEAD)"
          node scripts/check-release.mjs \
            --plan "$plan" \
            --tag "$RELEASE_TAG" \
            --commit "$commit" \
            --check-tag
          plan_sha256="$(sha256sum "$plan" | cut -d ' ' -f 1)"
          node -e '
            const plan = require(`./${process.env.PLAN_PATH}`);
            for (const key of [`channel`, `profile`, `tag`, `version`]) {
              process.stdout.write(`${key}=${plan[key]}\n`);
            }
          ' >> "$GITHUB_OUTPUT"
          {
            echo "artifact_name=desktop-pretag-${RELEASE_TAG}-$(node -p "require('./$plan').profile")-$plan_sha256"
            echo "commit=$commit"
            echo "plan=$plan"
            echo "plan_sha256=$plan_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Verify release history and resolve candidate
        id: evidence
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
          EXPLICIT_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || '' }}
          EXPECTED_ARTIFACT: ${{ steps.plan.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
          PLAN_PATH: ${{ steps.plan.outputs.plan }}
        run: |
          git merge-base --is-ancestor "$COMMIT" origin/main
          node -e '
            const {execFileSync} = require("node:child_process");
            const plan = require(`./${process.env.PLAN_PATH}`);
            const gh = args => execFileSync("gh", args, {encoding: "utf8"});
            const artifactsFor = runId => JSON.parse(gh([
              "api", `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}/artifacts?per_page=100`
            ])).artifacts ?? [];
            const exactRetainedArtifact = (runId, name) => {
              const matches = artifactsFor(runId).filter(artifact => artifact.name === name);
              return matches.length === 1 && !matches[0].expired &&
                Number.isSafeInteger(matches[0].size_in_bytes) && matches[0].size_in_bytes > 0;
            };
            const published = JSON.parse(gh([
              "release", "list", "--repo", process.env.GITHUB_REPOSITORY,
              "--limit", "100", "--json", "isDraft,tagName"
            ])).filter(release => !release.isDraft);
            if (published.some(release => release.tagName === plan.tag)) {
              throw new Error(`${plan.tag} is already published and immutable.`);
            }
            if (plan.firstRelease && published.length > 0) {
              throw new Error("firstRelease cannot be true after a published release.");
            }
            if (!plan.firstRelease) {
              const previousTag = `v${plan.previousKnownGoodVersion}`;
              const previous = JSON.parse(gh([
                "release", "view", previousTag, "--repo", process.env.GITHUB_REPOSITORY,
                "--json", "isDraft,tagName"
              ]));
              if (previous.isDraft || previous.tagName !== previousTag) {
                throw new Error(`${previousTag} is not a published previous release.`);
              }
            }
            let candidateRunId = process.env.EXPLICIT_CANDIDATE_RUN_ID;
            if (!candidateRunId) {
              const runs = JSON.parse(gh([
                "run", "list", "--repo", process.env.GITHUB_REPOSITORY,
                "--commit", process.env.COMMIT, "--workflow", "release-candidate.yml",
                "--status", "completed", "--limit", "100",
                "--json", "conclusion,createdAt,databaseId,event,headSha"
              ])).filter(run =>
                run.conclusion === "success" && run.event === "workflow_dispatch" &&
                run.headSha === process.env.COMMIT
              ).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
              candidateRunId = runs.find(run =>
                exactRetainedArtifact(run.databaseId, process.env.EXPECTED_ARTIFACT)
              )?.databaseId;
              if (!candidateRunId) {
                throw new Error(`No successful nonexpired exact-main candidate retains ${process.env.EXPECTED_ARTIFACT}.`);
              }
            }
            process.stdout.write(`candidate_run_id=${candidateRunId}\n`);
          ' >> "$GITHUB_OUTPUT"

  draft:
    name: Verify candidate and create or refresh draft
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.publish == false
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - name: Fetch and verify candidate run evidence
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ needs.prepare.outputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          gh api "repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/candidate-artifacts.json"
          node scripts/release-candidate.mjs verify-run \
            --artifact-name "${{ needs.prepare.outputs.artifact_name }}" \
            --artifacts-json "$RUNNER_TEMP/candidate-artifacts.json" \
            --commit "${{ needs.prepare.outputs.commit }}" \
            --repository "${{ github.repository }}" \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-json "$RUNNER_TEMP/candidate-run.json"
      - name: Download exact-main pre-tag candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: artifacts/reused-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}
      - name: Resolve metadata-bound CI run identities
        id: bound-evidence
        run: |
          node scripts/release-candidate.mjs write-bound-run-outputs \
            --commit "${{ needs.prepare.outputs.commit }}" \
            --metadata artifacts/reused-candidate/release-candidate.json \
            --output "$GITHUB_OUTPUT" \
            --repository "${{ github.repository }}"
      - name: Fetch metadata-bound CI run evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ steps.bound-evidence.outputs.quality_run_id }}" > "$RUNNER_TEMP/quality-run.json"
          gh api "repos/${{ github.repository }}/actions/runs/${{ steps.bound-evidence.outputs.packaged_run_id }}" > "$RUNNER_TEMP/packaged-run.json"
      - name: Validate downloaded candidate identity and bytes
        run: |
          node scripts/release-candidate.mjs verify-unit \
            --artifact-name "${{ needs.prepare.outputs.artifact_name }}" \
            --artifacts-json "$RUNNER_TEMP/candidate-artifacts.json" \
            --commit "${{ needs.prepare.outputs.commit }}" \
            --distribution "artifacts/reused-candidate/${{ needs.prepare.outputs.profile }}" \
            --metadata artifacts/reused-candidate/release-candidate.json \
            --packaged-run-json "$RUNNER_TEMP/packaged-run.json" \
            --plan "${{ needs.prepare.outputs.plan }}" \
            --quality-run-json "$RUNNER_TEMP/quality-run.json" \
            --repository "${{ github.repository }}" \
            --run-id "${{ needs.prepare.outputs.candidate_run_id }}" \
            --run-json "$RUNNER_TEMP/candidate-run.json" \
            --tag "${{ needs.prepare.outputs.tag }}"
      - name: Create or refresh draft from verified candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_PROFILE: ${{ needs.prepare.outputs.profile }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          distribution="artifacts/reused-candidate/$RELEASE_PROFILE"
          if ! gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' >/dev/null 2>&1; then
            args=("$RELEASE_TAG" --draft --verify-tag --title "Twine RS $RELEASE_VERSION" --notes-file "$distribution/release-notes.md")
            if [[ "$RELEASE_CHANNEL" == 'prerelease' ]]; then args+=(--prerelease); fi
            gh release create "${args[@]}"
          else
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = 'true'
            prerelease=false
            if [[ "$RELEASE_CHANNEL" == 'prerelease' ]]; then prerelease=true; fi
            gh release edit "$RELEASE_TAG" --title "Twine RS $RELEASE_VERSION" --notes-file "$distribution/release-notes.md" --prerelease="$prerelease"
          fi
          mapfile -d '' assets < <(find "$distribution" -type f -print0)
          gh release upload "$RELEASE_TAG" \
            "${assets[@]}" \
            artifacts/reused-candidate/release-candidate.json \
            --clobber
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq '.databaseId')"
          gh api "repos/${{ github.repository }}/releases/$release_id" > "$RUNNER_TEMP/draft-release.json"
          node scripts/release-candidate.mjs verify-draft \
            --distribution "$distribution" \
            --metadata artifacts/reused-candidate/release-candidate.json \
            --release-json "$RUNNER_TEMP/draft-release.json"

  publish:
    name: Validate and publish immutable release
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      issues: read
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - name: Fetch candidate and release evidence
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ needs.prepare.outputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          gh api "repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/candidate-artifacts.json"
          release_id="$(gh release view "${{ needs.prepare.outputs.tag }}" --json databaseId --jq '.databaseId')"
          gh api "repos/${{ github.repository }}/releases/$release_id" > "$RUNNER_TEMP/draft-release.json"
          node scripts/release-candidate.mjs verify-run \
            --artifact-name "${{ needs.prepare.outputs.artifact_name }}" \
            --artifacts-json "$RUNNER_TEMP/candidate-artifacts.json" \
            --commit "${{ needs.prepare.outputs.commit }}" \
            --repository "${{ github.repository }}" \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-json "$RUNNER_TEMP/candidate-run.json"
      - name: Download inspected exact-main candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: artifacts/reused-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}
      - name: Resolve metadata-bound CI run identities
        id: bound-evidence
        run: |
          node scripts/release-candidate.mjs write-bound-run-outputs \
            --commit "${{ needs.prepare.outputs.commit }}" \
            --metadata artifacts/reused-candidate/release-candidate.json \
            --output "$GITHUB_OUTPUT" \
            --repository "${{ github.repository }}"
      - name: Fetch metadata-bound CI run evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ steps.bound-evidence.outputs.quality_run_id }}" > "$RUNNER_TEMP/quality-run.json"
          gh api "repos/${{ github.repository }}/actions/runs/${{ steps.bound-evidence.outputs.packaged_run_id }}" > "$RUNNER_TEMP/packaged-run.json"
      - name: Validate candidate and unchanged inspected draft
        run: |
          node scripts/release-candidate.mjs verify \
            --artifact-name "${{ needs.prepare.outputs.artifact_name }}" \
            --artifacts-json "$RUNNER_TEMP/candidate-artifacts.json" \
            --commit "${{ needs.prepare.outputs.commit }}" \
            --distribution "artifacts/reused-candidate/${{ needs.prepare.outputs.profile }}" \
            --metadata artifacts/reused-candidate/release-candidate.json \
            --packaged-run-json "$RUNNER_TEMP/packaged-run.json" \
            --plan "${{ needs.prepare.outputs.plan }}" \
            --quality-run-json "$RUNNER_TEMP/quality-run.json" \
            --release-json "$RUNNER_TEMP/draft-release.json" \
            --repository "${{ github.repository }}" \
            --run-id "${{ needs.prepare.outputs.candidate_run_id }}" \
            --run-json "$RUNNER_TEMP/candidate-run.json" \
            --tag "${{ needs.prepare.outputs.tag }}"
      - name: Fetch durable release checklist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_PATH: ${{ needs.prepare.outputs.plan }}
        run: |
          checklist_url="$(node -p "require('./${PLAN_PATH}').checklistIssue")"
          gh issue view "$checklist_url" --json url,state,body > "$RUNNER_TEMP/release-checklist.json"
      - name: Generate retained publication evidence
        shell: bash
        run: |
          distribution="artifacts/reused-candidate/${{ needs.prepare.outputs.profile }}"
          cp artifacts/reused-candidate/release-candidate.json "$distribution/release-candidate.json"
          node scripts/check-release.mjs \
            --plan "${{ needs.prepare.outputs.plan }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --commit "${{ needs.prepare.outputs.commit }}" \
            --phase publish \
            --checklist-json "$RUNNER_TEMP/release-checklist.json" \
            --artifact-manifest "$distribution/artifact-manifest.json" \
            --candidate-artifacts-json "$RUNNER_TEMP/candidate-artifacts.json" \
            --candidate-metadata "$distribution/release-candidate.json" \
            --write-record "$distribution/release-record.json"
          node scripts/archive-release.mjs \
            --source "$distribution" \
            --output "artifacts/Twine-RS-${{ needs.prepare.outputs.version }}-release-evidence.zip" \
            --prefix "Twine-RS-${{ needs.prepare.outputs.version }}-release-evidence"
          node scripts/release-candidate.mjs write-publication-assets \
            --evidence "artifacts/Twine-RS-${{ needs.prepare.outputs.version }}-release-evidence.zip" \
            --output "$RUNNER_TEMP/publication-assets.json" \
            --release-record "$distribution/release-record.json"
      - name: Upload final evidence and publish
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PROFILE: ${{ needs.prepare.outputs.profile }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          distribution="artifacts/reused-candidate/$RELEASE_PROFILE"
          evidence="artifacts/Twine-RS-$RELEASE_VERSION-release-evidence.zip"
          gh release upload "$RELEASE_TAG" "$distribution/release-record.json" "$evidence" --clobber
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq '.databaseId')"
          gh api "repos/${{ github.repository }}/releases/$release_id" > "$RUNNER_TEMP/prepublish-release.json"
          node scripts/release-candidate.mjs verify-publication \
            --metadata artifacts/reused-candidate/release-candidate.json \
            --publication-assets "$RUNNER_TEMP/publication-assets.json" \
            --release-json "$RUNNER_TEMP/prepublish-release.json"
          gh release edit "$RELEASE_TAG" --draft=false
          test "$(gh release view "$RELEASE_TAG" --json isImmutable --jq '.isImmutable')" = 'true'
          attestation_verified=false
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "$RELEASE_TAG"; then attestation_verified=true; break; fi
            sleep 5
          done
          test "$attestation_verified" = 'true'
          release_url="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"

  fresh-download-smoke:
    name: ${{ matrix.label }} fresh release smoke
    needs: [prepare, publish]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            platform: linux
            os: ubuntu-24.04
            pattern: Twine-RS-*-linux-x86_64.AppImage
          - label: macOS ARM64
            platform: mac
            os: macos-15
            pattern: Twine-RS-*-mac-arm64*.dmg
          - label: Windows x64
            platform: win
            os: windows-2025
            pattern: Twine-RS-*-win-x64*.exe
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Install Playwright Chromium and dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install --yes --no-install-recommends libglib2.0-bin
      - name: Download published asset and checksums
        shell: bash
        env:
          ASSET_PATTERN: ${{ matrix.pattern }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          download_dir="$RUNNER_TEMP/twine-release-download"
          mkdir -p "$download_dir"
          gh release download "$RELEASE_TAG" --pattern "$ASSET_PATTERN" --pattern SHA256SUMS.txt --dir "$download_dir"
          asset="$(find "$download_dir" -maxdepth 1 -type f ! -name SHA256SUMS.txt -print -quit)"
          node scripts/verify-release-download.mjs "$download_dir/SHA256SUMS.txt" "$asset"
          echo "TWINE_DOWNLOADED_ASSET=$asset" >> "$GITHUB_ENV"
      - name: Exercise downloaded Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x "$TWINE_DOWNLOADED_ASSET"
          APPIMAGE_EXTRACT_AND_RUN=1 TWINE_E2E_EXECUTABLE="$TWINE_DOWNLOADED_ASSET" xvfb-run --auto-servernum npm run e2e:electron:packaged
      - name: Mount and smoke downloaded macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mount_dir="$RUNNER_TEMP/twine-rs-release-dmg"
          mkdir -p "$mount_dir"
          hdiutil attach "$TWINE_DOWNLOADED_ASSET" -nobrowse -readonly -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          TWINE_E2E_EXECUTABLE="$mount_dir/Twine RS.app/Contents/MacOS/Twine RS" npm run e2e:electron:packaged -- --grep "drains a trailing|preserves sibling"
          hdiutil detach "$mount_dir"
          trap - EXIT
      - name: Install downloaded Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDirectory = Join-Path $env:RUNNER_TEMP 'twine-rs-release-installed'
          $process = Start-Process -FilePath $env:TWINE_DOWNLOADED_ASSET -ArgumentList @('/S', "/D=$installDirectory") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)." }
          $executable = Join-Path $installDirectory 'Twine RS.exe'
          $uninstaller = Join-Path $installDirectory 'Uninstall Twine RS.exe'
          "TWINE_E2E_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TWINE_E2E_UNINSTALLER=$uninstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Smoke downloaded Windows package
        if: runner.os == 'Windows'
        run: npm run e2e:electron:packaged
      - name: Uninstall downloaded Windows package
        if: always() && runner.os == 'Windows' && env.TWINE_E2E_UNINSTALLER != ''
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:TWINE_E2E_UNINSTALLER -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Uninstaller exited with code $($process.ExitCode)." }
      - name: Retain fresh-download diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-download-diagnostics-${{ matrix.platform }}
          path: output/playwright/packaged-electron
          if-no-files-found: warn
          retention-days: 14

  record-closeout-evidence:
    name: Record post-publication evidence
    needs: [prepare, publish, fresh-download-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Link successful fresh-download evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_PATH: ${{ needs.prepare.outputs.plan }}
          RELEASE_URL: ${{ needs.publish.outputs.release_url }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          checklist_url="$(node -p "require('./${PLAN_PATH}').checklistIssue")"
          gh issue comment "$checklist_url" --body "Post-publication fresh-download smoke passed on Windows, macOS, and Linux. Release: $RELEASE_URL. Workflow evidence: $WORKFLOW_URL. Complete the remaining Post-publication items, then close this checklist."
